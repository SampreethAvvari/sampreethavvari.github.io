name = "sampreeth-teaching"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Teaching Hub backend: per-material view/download counters and private reviews
# (rating + feedback) stored in Cloudflare D1, with feedback emailed to the
# owner via Resend.
#
# RESEND_API_KEY is a SECRET — do NOT put it here. Set it with:
#   wrangler secret put RESEND_API_KEY
[vars]
ALLOWED_ORIGINS = "https://sampreethavvari.com,https://www.sampreethavvari.com,https://sampreethavvari.github.io,http://localhost:4321,http://localhost:3000"
FEEDBACK_TO = "spa9659@nyu.edu"

[[d1_databases]]
binding = "TEACHING_DB"
database_name = "sampreeth-teaching"
# Created 2026-10-29 with:
#   wrangler d1 create sampreeth-teaching
database_id = "e4ea1f27-42c7-4ba5-81a8-df8ceacbcea8"

[observability]
enabled = true
