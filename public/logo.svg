<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sampreeth Avvari">
  <title>Sampreeth Avvari</title>
  <defs>
    <!-- The S is a comet's path: a bright head at the top, the trail cooling
         from blue to violet as it falls away. -->
    <linearGradient id="sa-trail" x1="22" y1="8" x2="10" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#8fb3ff"/>
      <stop offset="0.75" stop-color="#5b8def" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="sa-glow">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cfe0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5b8def" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M21.6 9.6C19.9 7.4 16.9 6.9 14.6 7.6 12.2 8.3 10.9 10.4 11.6 12.6 12.4 15 16 15.4 18.6 16.4 21.3 17.4 22.4 19.6 21.4 22 20.3 24.5 16.9 25.6 13.8 24.6 12.4 24.1 11.3 23.3 10.6 22.3" fill="none" stroke="url(#sa-trail)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="21.6" cy="9.6" r="3.4" fill="url(#sa-glow)"/>
  <circle cx="21.6" cy="9.6" r="1.5" fill="#ffffff"/>
</svg>
